[package]
name = "sanos"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "SANOS: Smooth strictly Arbitrage-free Non-parametric Option Surfaces (Rust implementation)"
repository = "https://github.com/djikeh/sanos"
documentation = "https://docs.rs/sanos"
homepage = "https://github.com/djikeh/sanos"
readme = "README.md"
keywords = ["options", "volatility", "arbitrage", "calibration", "quant"]
categories = ["science", "mathematics"]

[features]
default = ["iv-jaeckel"]

# Implied vol
iv-jaeckel = ["dep:jaeckel"]

# Optional serialization
serde = ["dep:serde"]

[dependencies]
log = "0.4"
resopt = "0.3.0"
statrs = "0.18.0"
jaeckel = { version = "0.2.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
