[package]
name = "sanos-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI harness for running SANOS calibrations on JSON snapshots"

[[bin]]
name = "sanos"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sanos = { path = "../sanos", features = ["serde"] }
sanos-io = { path = "../sanos-io" }
